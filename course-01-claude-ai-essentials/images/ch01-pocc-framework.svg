<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f4ef"/>
  <text x="60" y="70" font-family="Georgia, serif" font-size="36" fill="#1a1a1a">POCC: a reusable briefing checklist</text>
  <rect x="60" y="140" width="250" height="400" rx="18" fill="#2f5d50"/>
  <text x="185" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff">Persona</text>
  <text x="185" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d7ebe3">Who Claude</text>
  <text x="185" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d7ebe3">should act as</text>
  <rect x="340" y="140" width="250" height="400" rx="18" fill="#1f3d36"/>
  <text x="465" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff">Objective</text>
  <text x="465" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d7ebe3">Exact deliverable</text>
  <text x="465" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d7ebe3">and success look</text>
  <rect x="620" y="140" width="250" height="400" rx="18" fill="#8a6a3c"/>
  <text x="745" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff">Context</text>
  <text x="745" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#f3e6d0">Facts, audience,</text>
  <text x="745" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#f3e6d0">sources, background</text>
  <rect x="900" y="140" width="250" height="400" rx="18" fill="#c45c26"/>
  <text x="1025" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff">Constraints</text>
  <text x="1025" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#ffe8da">Length, format,</text>
  <text x="1025" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#ffe8da">must / must-not</text>
</svg>
