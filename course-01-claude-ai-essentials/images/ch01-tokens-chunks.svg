<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f4ef"/>
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" fill="#1a1a1a">Tokens are chunks Claude counts</text>
  <text x="60" y="120" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#555555">A sentence becomes pieces — volume drives cost and context use</text>
  <rect x="80" y="180" width="140" height="90" rx="12" fill="#2f5d50"/><text x="150" y="235" text-anchor="middle" fill="#fff" font-size="22" font-family="Helvetica, Arial, sans-serif">Ship</text>
  <rect x="240" y="180" width="140" height="90" rx="12" fill="#1f3d36"/><text x="310" y="235" text-anchor="middle" fill="#fff" font-size="22" font-family="Helvetica, Arial, sans-serif">ment</text>
  <rect x="400" y="180" width="140" height="90" rx="12" fill="#8a6a3c"/><text x="470" y="235" text-anchor="middle" fill="#fff" font-size="22" font-family="Helvetica, Arial, sans-serif">delay</text>
  <rect x="560" y="180" width="100" height="90" rx="12" fill="#c45c26"/><text x="610" y="235" text-anchor="middle" fill="#fff" font-size="22" font-family="Helvetica, Arial, sans-serif">ed</text>
  <rect x="680" y="180" width="120" height="90" rx="12" fill="#6b8f71"/><text x="740" y="235" text-anchor="middle" fill="#fff" font-size="22" font-family="Helvetica, Arial, sans-serif">Friday</text>
  <rect x="80" y="320" width="1000" height="240" rx="16" fill="#ffffff" stroke="#d9d0c3" stroke-width="2"/>
  <text x="110" y="380" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1a1a1a">Why office workers care</text>
  <text x="110" y="430" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#444444">1. Longer wandering chats = more tokens = more time and cost</text>
  <text x="110" y="475" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#444444">2. Uploaded files also consume the desk (context)</text>
  <text x="110" y="520" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#444444">3. Specific briefs usually beat retry loops</text>
</svg>