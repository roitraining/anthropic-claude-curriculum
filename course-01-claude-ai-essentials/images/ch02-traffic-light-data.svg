<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f4ef"/>
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" fill="#1a1a1a">What may go into Claude.ai?</text>
  <rect x="70" y="130" width="340" height="420" rx="18" fill="#2f5d50"/>
  <circle cx="240" cy="200" r="36" fill="#7dcea0"/>
  <text x="240" y="280" text-anchor="middle" fill="#fff" font-size="26" font-family="Helvetica, Arial, sans-serif">Green</text>
  <text x="240" y="330" text-anchor="middle" fill="#d7ebe3" font-size="18" font-family="Helvetica, Arial, sans-serif">Public copy</text>
  <text x="240" y="365" text-anchor="middle" fill="#d7ebe3" font-size="18" font-family="Helvetica, Arial, sans-serif">Approved templates</text>
  <text x="240" y="400" text-anchor="middle" fill="#d7ebe3" font-size="18" font-family="Helvetica, Arial, sans-serif">Redacted notes</text>
  <rect x="430" y="130" width="340" height="420" rx="18" fill="#8a6a3c"/>
  <circle cx="600" cy="200" r="36" fill="#f0c75e"/>
  <text x="600" y="280" text-anchor="middle" fill="#fff" font-size="26" font-family="Helvetica, Arial, sans-serif">Yellow</text>
  <text x="600" y="330" text-anchor="middle" fill="#f3e6d0" font-size="18" font-family="Helvetica, Arial, sans-serif">Internal process docs</text>
  <text x="600" y="365" text-anchor="middle" fill="#f3e6d0" font-size="18" font-family="Helvetica, Arial, sans-serif">Vendor email (redacted)</text>
  <text x="600" y="400" text-anchor="middle" fill="#f3e6d0" font-size="18" font-family="Helvetica, Arial, sans-serif">Ask policy first</text>
  <rect x="790" y="130" width="340" height="420" rx="18" fill="#8b3a2f"/>
  <circle cx="960" cy="200" r="36" fill="#e07474"/>
  <text x="960" y="280" text-anchor="middle" fill="#fff" font-size="26" font-family="Helvetica, Arial, sans-serif">Red</text>
  <text x="960" y="330" text-anchor="middle" fill="#ffd4d4" font-size="18" font-family="Helvetica, Arial, sans-serif">Secrets / passwords</text>
  <text x="960" y="365" text-anchor="middle" fill="#ffd4d4" font-size="18" font-family="Helvetica, Arial, sans-serif">Raw HR / payroll</text>
  <text x="960" y="400" text-anchor="middle" fill="#ffd4d4" font-size="18" font-family="Helvetica, Arial, sans-serif">Banned contracts</text>
</svg>