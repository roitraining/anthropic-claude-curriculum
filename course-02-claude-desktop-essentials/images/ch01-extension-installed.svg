  <rect width="1200" height="675" fill="#ece7df"/>
  <rect x="40" y="40" width="1120" height="595" rx="12" fill="#ffffff" stroke="#c45c26" stroke-width="4" stroke-dasharray="12 8"/>
  <rect x="40" y="40" width="1120" height="64" rx="12" fill="#c45c26"/>
  <text x="60" y="82" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff">HUMAN SCREENSHOT NEEDED</text>
  <text x="60" y="150" font-family="Georgia, serif" font-size="32" fill="#1a1a1a">Desktop Extensions with a local extension enabled</text>
  <text x="80" y="200" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333">- Settings -> Extensions (or equivalent) visible</text>
<text x="80" y="236" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333">- Filesystem or Calendar extension shown as on/installed</text>
<text x="80" y="272" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333">- Prefer a narrowly scoped folder name like WeeklyStatus</text>
<text x="80" y="308" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333">- Blur any unrelated org-only extensions if needed</text>
  <text x="60" y="620" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#666666">Replace this SVG with a real PNG capture, then update the Markdown image path to .png</text>
