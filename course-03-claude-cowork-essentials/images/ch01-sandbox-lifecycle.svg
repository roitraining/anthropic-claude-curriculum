<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f4ef"/>
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" fill="#1a1a1a">Cowork sandbox lifecycle</text>
  <rect x="80" y="180" width="280" height="220" rx="16" fill="#2f5d50"/>
  <text x="220" y="280" text-anchor="middle" fill="#fff" font-size="24" font-family="Helvetica, Arial, sans-serif">1. Create</text>
  <text x="220" y="325" text-anchor="middle" fill="#d7ebe3" font-size="16" font-family="Helvetica, Arial, sans-serif">Fresh remote sandbox</text>
  <polygon points="390,290 440,265 440,315" fill="#8a6a3c"/>
  <rect x="460" y="180" width="280" height="220" rx="16" fill="#c45c26"/>
  <text x="600" y="280" text-anchor="middle" fill="#fff" font-size="24" font-family="Helvetica, Arial, sans-serif">2. Work</text>
  <text x="600" y="325" text-anchor="middle" fill="#ffe8da" font-size="16" font-family="Helvetica, Arial, sans-serif">Only authorized doors</text>
  <polygon points="770,290 820,265 820,315" fill="#8a6a3c"/>
  <rect x="840" y="180" width="280" height="220" rx="16" fill="#1f3d36"/>
  <text x="980" y="280" text-anchor="middle" fill="#fff" font-size="24" font-family="Helvetica, Arial, sans-serif">3. Destroy</text>
  <text x="980" y="325" text-anchor="middle" fill="#d7ebe3" font-size="16" font-family="Helvetica, Arial, sans-serif">Session ends → teardown</text>
  <text x="60" y="500" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#444444">Persist outputs you need into approved systems before you close.</text>
  <text x="60" y="545" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#666666">No local VM required for the default remote execution model.</text>
</svg>