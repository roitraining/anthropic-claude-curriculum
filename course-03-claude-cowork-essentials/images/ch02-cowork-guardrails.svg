<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f4ef"/>
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" fill="#1a1a1a">Cowork guardrails that matter</text>
  <rect x="70" y="150" width="340" height="360" rx="18" fill="#2f5d50"/>
  <text x="240" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff">Scope</text>
  <text x="240" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d7ebe3">Folders and connectors</text>
  <text x="240" y="325" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d7ebe3">you explicitly attach</text>
  <rect x="430" y="150" width="340" height="360" rx="18" fill="#c45c26"/>
  <text x="600" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff">Approvals</text>
