<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f4ef"/>
  <text x="60" y="70" font-family="Georgia, serif" font-size="36" fill="#1a1a1a">How a Claude reply happens</text>
  <rect x="60" y="140" width="240" height="120" rx="16" fill="#2f5d50"/>
  <text x="180" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff">Your brief</text>
  <text x="180" y="225" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d7ebe3">POCC + files</text>
  <polygon points="320,200 370,180 370,220" fill="#8a6a3c"/>
  <rect x="390" y="140" width="280" height="120" rx="16" fill="#1f3d36"/>
  <text x="530" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff">Claude predicts</text>
  <text x="530" y="225" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d7ebe3">useful next text</text>
  <polygon points="690,200 740,180 740,220" fill="#8a6a3c"/>
  <rect x="760" y="140" width="360" height="120" rx="16" fill="#c45c26"/>
  <text x="940" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff">Draft you review</text>
  <text x="940" y="225" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#ffe8da">Edit · verify · send</text>
  <rect x="60" y="340" width="1060" height="220" rx="20" fill="#ffffff" stroke="#d9d0c3" stroke-width="2"/>
  <text x="100" y="400" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1a1a1a">Not a search engine. Not a database.</text>
  <text x="100" y="450" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#444444">Specific briefs narrow the guess. Vague briefs look confident and wrong.</text>
  <text x="100" y="510" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#444444">Human judgment stays on the control plane.</text>
</svg>
