  <text x="1070" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff">Change</text>
  <text x="60" y="480" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#444444">Then run tests. The diff is the contract.</text>
</svg>
