<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f4ef"/>
  <text x="60" y="70" font-family="Georgia, serif" font-size="34" fill="#1a1a1a">Plan, approve, execute</text>
  <rect x="70" y="160" width="320" height="220" rx="18" fill="#2f5d50"/>
  <text x="230" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff">Plan</text>
  <text x="230" y="305" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d7ebe3">Work order first</text>
  <polygon points="420,270 470,245 470,295" fill="#8a6a3c"/>
  <rect x="490" y="160" width="320" height="220" rx="18" fill="#c45c26"/>
  <text x="650" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff">Approve</text>
  <text x="650" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#ffe8da">Manual · Always-allow · Auto</text>
  <polygon points="840,270 890,245 890,295" fill="#8a6a3c"/>
  <rect x="910" y="160" width="220" height="220" rx="18" fill="#1f3d36"/>
  <text x="1020" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff">Execute</text>
  <text x="1020" y="305" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d7ebe3">Then verify</text>
  <text x="60" y="480" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#444444">Approval mode is a trust dial. Start manual when blast radius is real.</text>
</svg>
